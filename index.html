<!DOCTYPE html>
<html lang="vi" :class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM Smart Schedule - Quản lý lịch trực</title>
    
    <!-- Firebase App & Database (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqsv8xo0KsAyM-TYIE58jqVvS2JPAeMk",
            authDomain: "ngochao-90782.firebaseapp.com",
            databaseURL: "https://ngochao-90782-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ngochao-90782",
            storageBucket: "ngochao-90782.firebasestorage.app",
            messagingSenderId: "609549450140",
            appId: "1:609549450140:web:4abf6b9a681805ff412659",
            measurementId: "G-T8YGX6ZW0D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbOnValue = onValue;
        window.fbUpdate = update;
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SheetJS Thư viện Xuất File Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans transition-colors duration-200" x-data="hrmApp()">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div x-show="!isLoggedIn" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" x-cloak>
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100 dark:border-gray-700">
            <div class="bg-indigo-600 px-6 py-8 text-center text-white">
                <div class="w-14 h-14 bg-white/10 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h2 class="text-2xl font-bold">HRM Smart Schedule</h2>
                <p class="text-indigo-200 text-sm mt-1">Hệ thống quản lý và đăng ký lịch trực ca</p>
            </div>
            <div class="p-8 space-y-5">
                <template x-if="loginError">
                    <div class="bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 text-sm p-3 rounded-lg border border-rose-200 dark:border-rose-800 text-center font-medium" x-text="loginError"></div>
                </template>

                <!-- Form Quản trị / Nhân viên -->
                <form @submit.prevent="handleAdminLogin" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tài khoản</label>
                        <input type="text" x-model="adminForm.username" required class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mật khẩu</label>
                        <input type="password" x-model="adminForm.password" required class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm">
                        Đăng Nhập Quản Trị Viên
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div x-show="isLoggedIn" class="min-h-screen flex flex-col" x-cloak>
        <header class="bg-white dark:bg-gray-800 shadow-sm px-6 py-4 flex justify-between items-center border-b dark:border-gray-700 transition-colors">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-gray-800 dark:text-white"><a href="https://hrm-system-indol-nu.vercel.app/" target="_blank" class="hover:text-indigo-600">HRM Smart Schedule</a></span>
                <span class="text-xs px-2.5 py-1 rounded-full font-medium bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300">Quyền: Admin</span>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <button @click="toggleDarkMode()" class="w-9 h-9 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-yellow-400 rounded-full flex items-center justify-center transition">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>
                <button @click="logout()" class="text-rose-600 dark:text-rose-400 hover:underline font-medium">Thoát</button>
            </div>
        </header>

        <main class="p-4 md:p-6 max-w-full flex-1 space-y-6">
            <!-- THANH THAO TÁC: THÊM, TÌM KIẾM, SAO CHÉP, XUẤT EXCEL -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="text" x-model="newEmpName" placeholder="Họ Tên nhân viên mới..." class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1 sm:w-52">
                        <button @click="addEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm whitespace-nowrap">
                            <i class="fa-solid fa-plus"></i> Thêm
                        </button>
                    </div>
                    <div class="relative w-full sm:w-auto">
                        <input type="text" x-model="searchKeyword" placeholder="Tìm tên nhân viên..." class="border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48">
                    </div>
                </div>

                <div class="flex items-center gap-2 flex-wrap w-full lg:w-auto justify-end">
                    <button @click="copyPreviousWeekSchedule()" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-copy"></i> Sao Chép Tuần Trước
                    </button>
                    <button @click="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-file-excel"></i> Xuất Excel
                    </button>
                </div>
            </div>

            <!-- BẢNG LỊCH TRỰC CÓ CỘT THỐNG KÊ TỔNG CA -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                            <th class="p-4 w-44">NHÂN VIÊN</th>
                            <template x-for="(day, index) in weekDays" :key="index">
                                <th class="p-3 text-center border-l border-gray-100 dark:border-gray-700">
                                    <div x-text="day.shortName" class="text-gray-800 dark:text-white font-bold text-xs"></div>
                                    <div x-text="day.dateStr" class="text-[10px] text-gray-400 font-normal"></div>
                                </th>
                            </template>
                            <th class="p-4 text-center border-l border-gray-100 dark:border-gray-700 w-24">TỔNG CA</th>
                            <th class="p-4 text-center border-l border-gray-100 dark:border-gray-700 w-16">XÓA</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-gray-700 text-sm">
                        <template x-for="emp in filteredEmployees" :key="emp.id">
                            <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-700/30 transition">
                                <td class="p-4 font-semibold text-gray-800 dark:text-white" x-text="emp.name"></td>
                                
                                <template x-for="(day, index) in weekDays" :key="index">
                                    <td class="p-2 text-center border-l border-gray-100 dark:border-gray-700 text-xs space-y-1">
                                        <template x-for="shiftNum in [1, 2, 3]" :key="shiftNum">
                                            <label class="flex items-center justify-center gap-1 cursor-pointer select-none text-gray-600 dark:text-gray-300">
                                                <input type="checkbox" 
                                                       :checked="hasShift(emp.name, day.dateKey, shiftNum)"
                                                       @change="toggleShift(emp.name, day.dateKey, shiftNum)"
                                                       class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                                                <span x-text="`Ca ${shiftNum}`" class="text-[11px]"></span>
                                            </label>
                                        </template>
                                    </td>
                                </template>

                                <!-- CỘT HIỂN THỊ TỔNG SỐ CA CÁ NHÂN -->
                                <td class="p-4 text-center border-l border-gray-100 dark:border-gray-700 font-bold text-indigo-600 dark:text-indigo-400" x-text="getEmployeeTotalShifts(emp.name)"></td>

                                <td class="p-4 text-center border-l border-gray-100 dark:border-gray-700">
                                    <button @click="deleteEmployee(emp.id, emp.name)" class="text-gray-400 hover:text-rose-600 transition">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('hrmApp', () => ({
                isLoggedIn: true,
                darkMode: false,
                searchKeyword: '',
                newEmpName: '',
                weekOffset: 0,
                weekDays: [],
                
                employees: [
                    { id: 1, name: 'Ngọc Hào' },
                    { id: 2, name: 'Anh Bình' },
                    { id: 3, name: 'Anh Đĩnh' },
                    { id: 4, name: 'Anh Vũ' },
                    { id: 5, name: 'anh Chiến' },
                    { id: 6, name: 'Anh Tú' },
                    { id: 7, name: 'Anh Hậu' },
                    { id: 8, name: 'Trung' },
                    { id: 9, name: 'Anh Xuân Huy' },
                    { id: 10, name: 'Công' },
                    { id: 11, name: 'Phạm phong' },
                    { id: 12, name: 'Duy Anh' },
                    { id: 13, name: 'Việt Nam' },
                    { id: 14, name: 'Anh Phong Gió' },
                    { id: 15, name: 'Khánh Nam' }
                ],
                shifts: {},

                init() {
                    this.calculateWeekDays();
                    this.initFirebaseListeners();
                },

                initFirebaseListeners() {
                    if (!window.db) return;
                    const shiftsRef = window.fbRef(window.db, 'shifts');
                    window.fbOnValue(shiftsRef, (snapshot) => {
                        this.shifts = snapshot.val() || {};
                    });
                },

                calculateWeekDays() {
                    const now = new Date();
                    now.setDate(now.getDate() + (this.weekOffset * 7));
                    const currentDay = now.getDay();
                    const diffToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
                    const monday = new Date(now);
                    monday.setDate(now.getDate() + diffToMonday);

                    const days = [];
                    const dayNames = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'];
                    for (let i = 0; i < 7; i++) {
                        const d = new Date(monday);
                        d.setDate(monday.getDate() + i);
                        const dateStr = `${d.getDate()}/${d.getMonth() + 1}`;
                        const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        days.push({
                            shortName: dayNames[i],
                            dateStr: dateStr,
                            dateKey: dateKey
                        });
                    }
                    this.weekDays = days;
                },

                get filteredEmployees() {
                    if (!this.searchKeyword.trim()) return this.employees;
                    return this.employees.filter(e => e.name.toLowerCase().includes(this.searchKeyword.toLowerCase()));
                },

                addEmployee() {
                    if (!this.newEmpName.trim()) return;
                    this.employees.push({
                        id: Date.now(),
                        name: this.newEmpName.trim()
                    });
                    this.newEmpName = '';
                },

                deleteEmployee(id, name) {
                    if (confirm(`Bạn có chắc muốn xóa nhân viên ${name}?`)) {
                        this.employees = this.employees.filter(e => e.id !== id);
                    }
                },

                hasShift(empName, dateKey, shiftNum) {
                    const key = `${empName}_${dateKey}_c${shiftNum}`;
                    return !!this.shifts[key];
                },

                toggleShift(empName, dateKey, shiftNum) {
                    const key = `${empName}_${dateKey}_c${shiftNum}`;
                    const currentVal = !!this.shifts[key];
                    window.fbSet(window.fbRef(window.db, `shifts/${key}`), !currentVal);
                },

                // Tính tổng số ca của nhân viên trong tuần hiện tại
                getEmployeeTotalShifts(empName) {
                    let total = 0;
                    this.weekDays.forEach(day => {
                        [1, 2, 3].forEach(shiftNum => {
                            if (this.hasShift(empName, day.dateKey, shiftNum)) {
                                total++;
                            }
                        });
                    });
                    return total;
                },

                copyPreviousWeekSchedule() {
                    if (!confirm('Sao chép lịch tuần trước sang tuần này?')) return;
                    const prevWeekDays = this.weekDays.map(day => {
                        const d = new Date(day.dateKey);
                        d.setDate(d.getDate() - 7);
                        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    });

                    const updates = {};
                    let count = 0;
                    this.employees.forEach(emp => {
                        this.weekDays.forEach((currDay, idx) => {
                            const prevDateKey = prevWeekDays[idx];
                            [1, 2, 3].forEach(shiftNum => {
                                if (this.shifts[`${emp.name}_${prevDateKey}_c${shiftNum}`]) {
                                    updates[`${emp.name}_${currDay.dateKey}_c${shiftNum}`] = true;
                                    count++;
                                }
                            });
                        });
                    });
                    if (count > 0) {
                        window.fbUpdate(window.fbRef(window.db, 'shifts'), updates)
                            .then(() => alert(`Đã sao chép thành công ${count} ca!`));
                    } else {
                        alert('Không có dữ liệu tuần trước!');
                    }
                },

                exportToExcel() {
                    if (typeof XLSX === 'undefined') return;
                    const excelData = [];
                    const header = ['STT', 'Tên nhân viên'];
                    this.weekDays.forEach(d => header.push(`${d.shortName} (${d.dateStr})`));
                    header.push('Tổng số ca');
                    excelData.push(header);

                    this.employees.forEach((emp, i) => {
                        const row = [i + 1, emp.name];
                        let total = 0;
                        this.weekDays.forEach(d => {
                            const active = [];
                            [1, 2, 3].forEach(s => {
                                if (this.hasShift(emp.name, d.dateKey, s)) {
                                    active.push(`Ca ${s}`);
                                    total++;
                                }
                            });
                            row.push(active.length > 0 ? active.join(', ') : '-');
                        });
                        row.push(total);
                        excelData.push(row);
                    });

                    const ws = XLSX.utils.aoa_to_sheet(excelData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'LichTruc');
                    XLSX.writeFile(wb, `BaoCao_LichTruc.xlsx`);
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                },

                logout() {
                    this.isLoggedIn = false;
                },

                handleAdminLogin() {
                    this.isLoggedIn = true;
                }
            }));
        });
    </script>
</body>
</html>
