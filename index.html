<!DOCTYPE html>
<html lang="vi" :class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM Smart Schedule - Quản lý lịch trực</title>
    <!-- Firebase App & Database (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const app = initializeApp(window.APP_CONFIG.firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbPush = push;
        window.fbRemove = remove;
        window.fbOnValue = onValue;
        window.fbUpdate = update;
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans transition-colors duration-200 pb-20 md:pb-0" x-data="hrmApp()">

    <!-- TOAST NOTIFICATION -->
    <div class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none" x-cloak>
        <template x-for="toast in toasts" :key="toast.id">
            <div class="flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium backdrop-blur-md"
                 :class="{'bg-emerald-50/90 dark:bg-emerald-900/90 border-emerald-200 text-emerald-800 dark:text-emerald-200': toast.type === 'success', 'bg-rose-50/90 dark:bg-rose-900/90 border-rose-200 text-rose-800 dark:text-rose-200': toast.type === 'error'}">
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div x-show="!isLoggedIn" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" x-cloak>
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100 dark:border-gray-700">
            <div class="bg-indigo-600 px-6 py-8 text-center text-white">
                <h2 class="text-2xl font-bold">HRM Smart Schedule</h2>
                <p class="text-indigo-200 text-sm mt-1">Hệ thống quản lý và đăng ký lịch trực ca</p>
            </div>
            <div class="p-8 space-y-5">
                <template x-if="loginError">
                    <div class="bg-rose-50 text-rose-600 text-sm p-3 rounded-lg text-center font-medium" x-text="loginError"></div>
                </template>
                <!-- Form Nhân viên -->
                <form x-show="loginType === 'staff'" @submit.prevent="handleStaffLogin" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Chọn tên nhân viên</label>
                        <select x-model="selectedStaffName" required class="w-full px-4 py-3 border rounded-xl dark:bg-gray-700 dark:text-white">
                            <option value="">-- Chọn tên của bạn --</option>
                            <template x-for="emp in employees" :key="emp.id">
                                <option :value="emp.name" x-text="emp.name"></option>
                            </template>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition">Vào Đăng Ký Lịch Trực</button>
                </form>
                <!-- Form Admin -->
                <form x-show="loginType === 'admin'" @submit.prevent="handleAdminLogin" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tên đăng nhập Quản trị</label>
                        <input type="text" x-model="adminForm.username" required class="w-full px-4 py-3 border rounded-xl dark:bg-gray-700 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mật khẩu</label>
                        <input type="password" x-model="adminForm.password" required class="w-full px-4 py-3 border rounded-xl dark:bg-gray-700 dark:text-white">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-xl transition">Đăng Nhập Quản Trị Viên</button>
                </form>
                <div class="text-center pt-2">
                    <button @click="loginType = loginType === 'staff' ? 'admin' : 'staff'; loginError = ''" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">
                        <span x-text="loginType === 'staff' ? 'Chuyển sang đăng nhập Quản trị viên' : 'Quay lại đăng nhập Nhân viên'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div x-show="isLoggedIn" class="min-h-screen flex flex-col" x-cloak>
        <header class="bg-white dark:bg-gray-800 shadow-sm px-6 py-4 flex justify-between items-center border-b dark:border-gray-700">
            <div class="flex items-center gap-3">
                <span class="text-xl font-bold text-gray-800 dark:text-white">HRM Smart Schedule</span>
                <span class="text-xs px-2.5 py-1 rounded-full font-medium" :class="role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'" x-text="role === 'admin' ? 'Admin' : 'Nhân viên'"></span>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <button @click="toggleDarkMode()" class="w-9 h-9 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 rounded-full flex items-center justify-center">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>
                <span class="text-gray-600 dark:text-gray-300">Xin chào, <strong class="text-indigo-600" x-text="currentUser"></strong></span>
                <button @click="logout()" class="text-rose-600 hover:underline font-medium">Thoát</button>
            </div>
        </header>

        <main class="p-6 max-w-full flex-1 space-y-6">
            <!-- Quản lý cấu hình nhân viên (Dành cho Admin hoặc tab Cấu hình) -->
            <div x-show="currentView === 'settings'" class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border dark:border-gray-700 space-y-4">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white">Quản lý danh sách nhân viên</h3>
                <div class="flex gap-3">
                    <input type="text" x-model="newStaffName" placeholder="Nhập tên nhân viên mới..." class="px-4 py-2 border rounded-xl flex-1 dark:bg-gray-700 dark:text-white">
                    <button @click="addEmployee" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-medium transition">Thêm nhân viên</button>
                </div>
                <div class="divide-y dark:divide-y-700">
                    <template x-for="emp in employees" :key="emp.id">
                        <div class="py-3 flex justify-between items-center">
                            <span class="text-gray-700 dark:text-gray-200 font-medium" x-text="emp.name"></span>
                            <button @click="deleteEmployee(emp.id)" class="text-rose-600 hover:text-rose-800 text-sm"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <script>
        function hrmApp() {
            return {
                isLoggedIn: false,
                loginType: 'staff',
                role: 'staff',
                currentUser: '',
                selectedStaffName: '',
                loginError: '',
                darkMode: false,
                currentView: 'settings',
                employees: [],
                newStaffName: '',
                toasts: [],

                init() {
                    // Lắng nghe dữ liệu nhân viên từ Firebase Realtime Database thời gian thực đúng chuẩn Object map sang Array
                    window.fbOnValue(window.fbRef(window.db, 'employees'), (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            this.employees = Object.keys(data).map(key => ({
                                id: key,
                                name: data[key].name
                            }));
                        } else {
                            this.employees = [];
                        }
                    });
                },

                showToast(message, type = 'success') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type });
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    }, 3000);
                },

                addEmployee() {
                    if (!this.newStaffName.trim()) return;
                    // Sử dụng push() để cấp phát khóa định danh riêng biệt, tránh ghi đè dữ liệu cũ
                    const empRef = window.fbRef(window.db, 'employees');
                    const newEmpRef = window.fbPush(empRef);
                    window.fbSet(newEmpRef, {
                        name: this.newStaffName.trim()
                    }).then(() => {
                        this.showToast('Thêm nhân viên thành công!');
                        this.newStaffName = '';
                    }).catch((error) => {
                        this.showToast('Lỗi khi thêm nhân viên: ' + error.message, 'error');
                    });
                },

                deleteEmployee(id) {
                    if (confirm('Bạn có chắc chắn muốn xóa nhân viên này?')) {
                        window.fbRemove(window.fbRef(window.db, `employees/${id}`)).then(() => {
                            this.showToast('Đã xóa nhân viên!');
                        });
                    }
                },

                handleStaffLogin() {
                    if (!this.selectedStaffName) return;
                    this.currentUser = this.selectedStaffName;
                    this.role = 'staff';
                    this.isLoggedIn = true;
                },

                handleAdminLogin() {
                    if (this.adminForm.username === 'admin' && this.adminForm.password === 'admin123') {
                        this.currentUser = 'Quản trị viên';
                        this.role = 'admin';
                        this.isLoggedIn = true;
                    } else {
                        this.loginError = 'Sai tên đăng nhập hoặc mật khẩu!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = '';
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                }
            }
        }
    </script>
</body>
</html>
